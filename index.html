<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutabaah Tahfizh — Data Hafalan Santri</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Logo SMPIT Miftahul Ulum" width="68" height="68">
  <div>
    <h1>SMPIT Miftahul Ulum</h1>
    <p>Sekolah Menengah Pertama Islam Terpadu</p>
    <p>Mutabaah Tahfizh · Semester Ganjil</p>
  </div>
</header>
<nav role="tablist" aria-label="Menu utama">
  <button role="tab" data-t="ringkasan" aria-selected="true">Ringkasan</button>
  <button role="tab" data-t="klasemen" aria-selected="false">Klasemen</button>
  <button role="tab" data-t="santri" aria-selected="false">Santri</button>
</nav>
<main>
  <section class="box sync" aria-label="Sumber data">
    <div><b>Data dari Excel</b><br><small id="sumber"></small></div>
    <div id="kontrol" hidden>
      <input id="berkas" type="file" accept=".xlsx,.xls" hidden>
      <button class="btn" id="btn-impor" type="button">Perbarui dari Excel</button>
    </div>
    <p class="msg" id="pesan" role="alert" style="flex-basis:100%"></p>
  </section>
  <div id="view"></div>
</main>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="script.js"></script>
</body>
</html>
